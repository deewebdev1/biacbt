<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quizzes — BIA CBT Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0B0C10; --red:#E31E24; --red-dark:#B81A1F; --text:#fff; --text-soft:rgba(255,255,255,.74); --text-faint:rgba(255,255,255,.5); --good:#4ADE9A; --good-bg:rgba(74,222,154,.16); --warn:#FFD166; --warn-bg:rgba(255,209,102,.14); --ease:cubic-bezier(.22,.61,.36,1); --spring:cubic-bezier(.34,1.4,.5,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body { min-height:100vh; min-height:100dvh; color:var(--text); font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; background:var(--ink); overflow-x:hidden; position:relative; display:flex; flex-direction:column; }
  h1,h2,h3 { font-family:'Plus Jakarta Sans','Inter',sans-serif; letter-spacing:-.02em; }
  a { color:inherit; text-decoration:none; }
  button,input { font:inherit; color:inherit; }
  button { cursor:pointer; background:none; border:0; }
  [hidden] { display:none !important; }
  .icon { width:1em; height:1em; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  a,button,input { outline:none; -webkit-tap-highlight-color:transparent; }
  a:focus-visible,button:focus-visible { outline:2px solid #fff; outline-offset:3px; border-radius:12px; }
  ::selection { background:var(--red); color:#fff; }

  .scene { position:fixed; inset:0; z-index:0; overflow:hidden; background:radial-gradient(80% 60% at 15% 0%,#4E0E12 0%,transparent 60%),radial-gradient(70% 60% at 100% 100%,#330A0D 0%,transparent 60%),linear-gradient(160deg,#14080A 0%,#0B0C10 55%,#0F0709 100%); }
  .orb { position:absolute; border-radius:50%; filter:blur(48px); will-change:transform; }
  .orb.o1 { width:42vmax; height:42vmax; left:-14vmax; top:-16vmax; background:radial-gradient(circle at 35% 35%,#FF4A50,var(--red) 45%,transparent 70%); opacity:.7; animation:drift1 24s ease-in-out infinite; }
  .orb.o2 { width:34vmax; height:34vmax; right:-12vmax; bottom:-14vmax; background:radial-gradient(circle at 40% 40%,#FF8A5C,#E3392A 45%,transparent 70%); opacity:.55; animation:drift2 28s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(6vmax,4vmax) scale(1.08); } }
  @keyframes drift2 { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(-5vmax,-5vmax) scale(1.1); } }
  .grain { position:absolute; inset:0; opacity:.07; mix-blend-mode:overlay; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  .glass { position:relative; isolation:isolate; background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.06) 45%,rgba(255,255,255,.10) 100%); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%); border:1px solid rgba(255,255,255,.22); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1.5px 0 rgba(255,255,255,.08),0 30px 60px -28px rgba(0,0,0,.7),0 10px 24px -12px rgba(0,0,0,.45); }
  .glass::before { content:''; position:absolute; inset:0; border-radius:inherit; z-index:-1; pointer-events:none; background:radial-gradient(420px circle at var(--mx,20%) var(--my,0%),rgba(255,255,255,.22),transparent 55%); }
  .glass::after { content:''; position:absolute; inset:0; border-radius:inherit; z-index:-1; pointer-events:none; padding:1px; background:linear-gradient(140deg,rgba(255,255,255,.65),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.32)); -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) { .glass { background:rgba(40,18,20,.9); } }

  .btn { position:relative; display:inline-flex; align-items:center; justify-content:center; gap:9px; height:46px; padding:0 20px; border-radius:14px; border:1px solid transparent; font-family:'Plus Jakarta Sans',sans-serif; font-size:14.5px; font-weight:700; white-space:nowrap; user-select:none; transition:transform .22s var(--ease),box-shadow .28s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease); }
  .btn .icon { font-size:17px; transition:transform .25s var(--ease); }
  .btn:active { transform:scale(.97); }
  .btn-red { color:#fff; background:linear-gradient(180deg,#FF4A50 0%,var(--red) 50%,var(--red-dark) 100%); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.18),0 14px 26px -12px rgba(227,30,36,.85),0 3px 8px rgba(0,0,0,.3); }
  .btn-red:hover { transform:translateY(-2px); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.18),0 20px 34px -14px rgba(227,30,36,.95),0 5px 12px rgba(0,0,0,.3); }
  .btn-red:hover .go { transform:translateX(4px); }
  .btn-ghost { color:#fff; background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.2); box-shadow:inset 0 1px 0 rgba(255,255,255,.3); }
  .btn-ghost:hover { background:rgba(255,255,255,.18); transform:translateY(-1px); }
  .btn[aria-disabled="true"] { opacity:.5; pointer-events:none; }

  /* Top bar */
  .bar { position:sticky; top:10px; z-index:40; margin:10px auto 0; width:calc(100% - 24px); max-width:1120px; border-radius:22px; display:flex; align-items:center; gap:12px; padding:9px 12px; }
  .icon-btn { width:44px; height:44px; border-radius:13px; display:inline-flex; align-items:center; justify-content:center; font-size:22px; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.2); box-shadow:inset 0 1px 0 rgba(255,255,255,.3); transition:background-color .2s var(--ease),transform .15s var(--ease); flex-shrink:0; }
  .icon-btn:hover { background:rgba(255,255,255,.18); } .icon-btn:active { transform:scale(.94); }
  .logo-pill { display:inline-flex; align-items:center; padding:5px 12px; border-radius:999px; background:rgba(255,255,255,.92); box-shadow:inset 0 1px 0 #fff,0 8px 18px -8px rgba(0,0,0,.6); }
  .logo-pill img { height:30px; width:auto; display:block; }
  .bar .sp { flex:1; }
  .me { display:inline-flex; align-items:center; gap:10px; height:44px; padding:0 14px 0 6px; border-radius:99px; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.16); max-width:240px; }
  .me .av { width:32px; height:32px; border-radius:50%; background:linear-gradient(160deg,#FF5A60,var(--red-dark)); display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:12px; flex-shrink:0; }
  .me span.n { font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Drawer */
  .scrim { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .3s var(--ease); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  .scrim.show { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:10px; bottom:10px; left:10px; z-index:90; width:min(310px,calc(100vw - 20px)); border-radius:28px; padding:18px 16px 16px; display:flex; flex-direction:column; transform:translateX(calc(-100% - 24px)); transition:transform .45s var(--ease); }
  .drawer.open { transform:none; }
  .drawer .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .drawer nav { display:grid; gap:6px; }
  .drawer nav button,.drawer nav a { display:flex; align-items:center; gap:13px; height:50px; padding:0 14px; border-radius:15px; font-size:15px; font-weight:600; color:var(--text-soft); text-align:left; width:100%; transition:background-color .2s var(--ease),color .2s var(--ease); }
  .drawer nav .icon { font-size:20px; }
  .drawer nav button:hover,.drawer nav a:hover { background:rgba(255,255,255,.1); color:#fff; }
  .drawer nav .on { background:linear-gradient(180deg,#EC2A30,var(--red)); color:#fff; box-shadow:0 12px 24px -12px rgba(227,30,36,.9),inset 0 1px 0 rgba(255,255,255,.3); }
  .drawer .who { margin-top:auto; padding:14px; border-radius:18px; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.14); font-size:12.5px; color:var(--text-faint); }
  .drawer .who b { display:block; font-size:14px; color:#fff; margin-bottom:2px; overflow-wrap:anywhere; }
  .drawer .out { margin-top:10px; }

  main { position:relative; flex:1; width:100%; max-width:1120px; margin:0 auto; padding:26px 12px 40px; }
  .rise { opacity:0; transform:translateY(16px); animation:rise .7s var(--ease) forwards; } .rise.d1 { animation-delay:.06s; } .rise.d2 { animation-delay:.14s; } .rise.d3 { animation-delay:.22s; }
  @keyframes rise { to { opacity:1; transform:none; } }

  .hello { padding:0 6px; margin-bottom:20px; }
  .hello h1 { font-size:clamp(26px,4vw,36px); font-weight:800; line-height:1.15; } .hello p { color:var(--text-soft); font-size:15px; margin-top:6px; }

  /* Tabs */
  .tabs { position:relative; display:grid; grid-template-columns:repeat(3,1fr); padding:5px; border-radius:20px; margin:0 0 16px; max-width:660px; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.12); box-shadow:inset 0 2px 6px rgba(0,0,0,.35); }
  .tabs button { position:relative; z-index:2; display:flex; align-items:center; justify-content:center; gap:9px; height:50px; border-radius:15px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15px; color:var(--text-soft); transition:color .25s var(--ease); }
  .tabs button .icon { font-size:18px; } .tabs button.on { color:#fff; }
  .tabs .n { min-width:24px; height:22px; padding:0 7px; border-radius:99px; font-size:11.5px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; background:rgba(0,0,0,.32); }
  .tabs .thumb { position:absolute; z-index:1; top:5px; bottom:5px; left:5px; width:calc(33.333% - 3.4px); border-radius:15px; background:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,.14)); border:1px solid rgba(255,255,255,.4); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 8px 18px -6px rgba(0,0,0,.5); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); transition:transform .5s var(--spring); }
  .tabs[data-tab="test"] .thumb { transform:translateX(100%); } .tabs[data-tab="results"] .thumb { transform:translateX(200%); }

  .info { display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-radius:18px; margin-bottom:16px; font-size:13.5px; color:var(--text-soft); }
  .info .icon { font-size:20px; margin-top:1px; color:#fff; } .info b { color:#fff; }
  .tools { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .search { position:relative; flex:1 1 240px; min-width:0; }
  .search .icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:18px; color:var(--text-faint); pointer-events:none; }
  .search input { width:100%; height:50px; padding:0 16px 0 46px; border-radius:16px; font-size:15px; background:rgba(0,0,0,.26); border:1px solid rgba(255,255,255,.16); box-shadow:inset 0 2px 5px rgba(0,0,0,.3); transition:border-color .25s var(--ease),box-shadow .25s var(--ease); }
  .search input::placeholder { color:var(--text-faint); }
  .search input:focus { border-color:rgba(255,255,255,.7); box-shadow:inset 0 2px 5px rgba(0,0,0,.3),0 0 0 4px rgba(255,255,255,.12); }
  .seg { display:flex; padding:4px; gap:4px; border-radius:16px; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.12); }
  .seg button { height:42px; padding:0 16px; border-radius:12px; font-size:13.5px; font-weight:700; color:var(--text-soft); transition:all .22s var(--ease); white-space:nowrap; }
  .seg button:hover { color:#fff; } .seg button.on { background:var(--red); color:#fff; box-shadow:0 8px 16px -8px rgba(227,30,36,.9); }

  .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
  .card { border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:14px; transition:transform .3s var(--ease); animation:rise .6s var(--ease) both; }
  .card:hover { transform:translateY(-4px); }
  .card .head { display:flex; align-items:flex-start; gap:13px; }
  .card .qi { width:46px; height:46px; border-radius:15px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:22px; background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.18); }
  .card.test .qi { background:rgba(227,30,36,.3); border-color:rgba(255,138,142,.5); }
  .card h3 { font-size:17px; font-weight:800; line-height:1.3; overflow-wrap:anywhere; }
  .card .sub { font-size:12.5px; color:var(--text-faint); margin-top:2px; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; }
  .chip { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px; border-radius:99px; font-size:12px; font-weight:700; color:var(--text-soft); background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.14); }
  .chip .icon { font-size:13px; } .chip.good { color:var(--good); background:var(--good-bg); border-color:rgba(74,222,154,.5); } .chip.warn { color:var(--warn); background:var(--warn-bg); border-color:rgba(255,209,102,.5); }
  .card .btn { margin-top:auto; width:100%; }

  .state { text-align:center; padding:46px 22px; border-radius:26px; color:var(--text-soft); font-size:15px; }
  .state .si { width:58px; height:58px; margin:0 auto 14px; border-radius:19px; display:flex; align-items:center; justify-content:center; font-size:27px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); box-shadow:inset 0 1px 0 rgba(255,255,255,.4); }
  .state h3 { font-size:19px; color:#fff; margin-bottom:6px; } .state p { max-width:380px; margin:0 auto 18px; font-size:14px; }
  .state .btn { margin:0 auto; }
  .skel { border-radius:24px; height:196px; background:linear-gradient(100deg,rgba(255,255,255,.06) 30%,rgba(255,255,255,.14) 50%,rgba(255,255,255,.06) 70%); background-size:300% 100%; animation:shimmer 1.4s linear infinite; border:1px solid rgba(255,255,255,.1); }
  @keyframes shimmer { from { background-position:100% 0; } to { background-position:0 0; } }

  /* Progress, resume, results history */
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
  .stat { border-radius:22px; padding:16px 16px 14px; animation:rise .6s var(--ease) both; }
  .stat .l { font-size:12.5px; font-weight:600; color:var(--text-soft); display:flex; align-items:center; gap:8px; } .stat .l .icon { font-size:16px; color:#fff; }
  .stat .v { font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:30px; line-height:1.15; letter-spacing:-.03em; margin-top:6px; font-variant-numeric:tabular-nums; } .stat .v small { font-size:15px; font-weight:700; color:var(--text-soft); margin-left:2px; }
  .resume { display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:22px; margin-bottom:12px; border-color:rgba(255,209,102,.45); }
  .resume .ri { width:46px; height:46px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--warn); background:var(--warn-bg); border:1px solid rgba(255,209,102,.5); flex-shrink:0; }
  .resume .rt { flex:1; min-width:0; } .resume .rt b { display:block; font-family:'Plus Jakarta Sans',sans-serif; font-size:15.5px; overflow-wrap:anywhere; } .resume .rt span { font-size:13px; color:var(--text-soft); }
  .resume .btn { flex-shrink:0; }
  .two { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:14px; margin-bottom:14px; }
  .panel { border-radius:24px; padding:20px; } .panel h3 { font-size:16px; font-weight:800; } .panel .sub2 { font-size:12.5px; color:var(--text-faint); margin:2px 0 16px; }
  .bars { display:flex; align-items:flex-end; justify-content:space-between; gap:6px; height:190px; }
  .bcol { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; }
  .bcol .b { width:100%; max-width:30px; border-radius:9px 9px 5px 5px; height:var(--h); min-height:8px; background:linear-gradient(180deg,#FF6A70,var(--red-dark)); transform-origin:bottom; animation:grow .9s var(--ease) both; box-shadow:0 8px 16px -10px rgba(227,30,36,.9); }
  .bcol .b.ok { background:linear-gradient(180deg,#6FF0B1,#1FA866); box-shadow:0 8px 16px -10px rgba(74,222,154,.9); } .bcol .b.mid { background:linear-gradient(180deg,#FFE08A,#D49A12); box-shadow:none; }
  .bcol .pc { font-size:10.5px; font-weight:800; color:var(--text-soft); } .bcol .dt { font-size:10px; color:var(--text-faint); white-space:nowrap; }
  @keyframes grow { from { transform:scaleY(.05); } to { transform:scaleY(1); } }
  .subj { display:grid; gap:14px; } .subj .top { display:flex; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:6px; color:var(--text-soft); } .subj .top b { color:#fff; font-variant-numeric:tabular-nums; }
  .meter { height:8px; border-radius:99px; background:rgba(0,0,0,.35); overflow:hidden; } .meter span { display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--red-dark),#FF5A60); transition:width 1s .2s var(--ease); }
  .alist { display:grid; gap:10px; }
  .arow { width:100%; display:flex; align-items:center; gap:14px; text-align:left; padding:14px 16px; border-radius:20px; animation:rise .5s var(--ease) both; transition:transform .25s var(--ease); }
  .arow:hover { transform:translateY(-2px); } .arow:active { transform:scale(.99); }
  .arow .qi { width:44px; height:44px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:21px; background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.18); }
  .arow .am { flex:1; min-width:0; } .arow .am b { display:block; font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; overflow-wrap:anywhere; } .arow .am span { font-size:12.5px; color:var(--text-faint); }
  .score { display:inline-flex; align-items:center; height:30px; padding:0 12px; border-radius:99px; font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--good); background:var(--good-bg); border:1px solid rgba(74,222,154,.5); flex-shrink:0; }
  .score.mid { color:var(--warn); background:var(--warn-bg); border-color:rgba(255,209,102,.5); } .score.low { color:#FF8A8E; background:rgba(255,122,127,.16); border-color:rgba(255,122,127,.5); }
  .arow .chev { font-size:18px; color:var(--text-faint); transition:transform .25s var(--ease); } .arow:hover .chev { transform:translateX(3px); color:#fff; }
  .arow.loading { opacity:.6; pointer-events:none; }
  .toast { position:fixed; left:50%; bottom:max(22px,env(safe-area-inset-bottom)); z-index:120; transform:translate(-50%,30px); opacity:0; pointer-events:none; padding:12px 18px; border-radius:16px; font-size:13.5px; font-weight:600; max-width:calc(100% - 28px); transition:all .35s var(--spring); } .toast.show { opacity:1; transform:translate(-50%,0); }
  @media (max-width:980px) { .stats { grid-template-columns:repeat(2,minmax(0,1fr)); } .two { grid-template-columns:1fr; } }
  @media (max-width:620px) { .stat { padding:14px; border-radius:20px; } .stat .v { font-size:25px; } .resume { flex-wrap:wrap; } .resume .btn { width:100%; } .panel { padding:16px; border-radius:22px; } .tabs button { gap:6px; font-size:13px; padding:0 2px; } .arow { padding:12px; gap:11px; } .arow .qi { width:40px; height:40px; } }
  @media (max-width:440px) { .tabs .n { display:none; } .bars { gap:3px; } }

  .foot { position:relative; text-align:center; padding:0 20px max(20px,env(safe-area-inset-bottom)); font-size:12.5px; color:var(--text-faint); }

  @media (max-width:980px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:620px) {
    .bar { top:6px; width:calc(100% - 16px); padding:8px 10px; gap:10px; border-radius:20px; } .logo-pill { padding:4px 10px; } .logo-pill img { height:26px; } .me .n { display:none; } .me { padding:0 6px; }
    main { padding:20px 10px 34px; } .grid { grid-template-columns:1fr; } .tabs { max-width:none; } .tabs button { height:48px; font-size:14px; }

<script>
(function () {
  /* ====================================================================
     CONFIG
     GET QUIZZES_API   header  Authorization: Bearer <token>
       -> { ok, quizzes:[ { code, title, subject, programme, mode: "practice"|"test", questions, duration_minutes,
                            status?: "available"|"in_progress"|"completed", last_score?: 78 } ] }
     The server decides which quizzes are shown. Test quizzes a student already finished should come back
     with status "completed" so they cannot be started again.
     GET HISTORY_API (paid students only) -> { ok, history, pass_mark, attempts:[ { id, quiz, title, subject, programme, mode, score, total, percent, seconds_taken, tab_switches, reason, at } ] }
     POST RESULT_API { id } -> { ok, result }   (the same result object the results page reads)
     DEMO = true previews with sample quizzes (add ?tier=free or ?tier=paid).
  ==================================================================== */
  var QUIZZES_API = '/api/open-quizzes';
  var HISTORY_API = '/api/my-results', RESULT_API = '/api/my-result', RESULTS_PAGE = 'results.html';
  var LOGIN_PAGE = 'login.html', QUIZ_PAGE = 'quiz.html';
  var FREE_CAN_TAKE_TEST = false;   /* false: Test mode is for paying tutorial students only */
  var DEMO = false;

  var params = new URLSearchParams(location.search);
  var session = null;
  try { session = JSON.parse(sessionStorage.getItem('bia_session') || 'null'); } catch (e) {}
  if (!session || !session.student) {
    if (DEMO) session = { tier: params.get('tier') === 'free' ? 'free' : 'paid', token: 'demo', student: { name: 'Chidi Okafor', bia_id: params.get('tier') === 'free' ? '' : '0042' } };
    else { location.replace(LOGIN_PAGE); return; }
  }
  var isPaid = session.tier === 'paid';
  var canTest = isPaid || FREE_CAN_TAKE_TEST;

  var $ = function (s) { return document.querySelector(s); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function ico(id, cls) { var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'icon' + (cls ? ' ' + cls : '')); var u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#' + id); s.appendChild(u); return s; }
  function initials(n) { var w = String(n || '?').trim().split(/\s+/); return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase(); }

  /* header + drawer */
  var name = session.student.name, first = String(name).trim().split(/\s+/)[0];
  $('#hello').textContent = 'Hi, ' + first;
  $('#meAv').textContent = initials(name); $('#meName').textContent = name; $('#me').hidden = false;
  $('#dName').textContent = name; $('#dTier').textContent = isPaid ? 'Paying tutorial' + (session.student.bia_id ? '  •  BIA ID ' + session.student.bia_id : '') : 'Free class';

  var drawer = $('#drawer'), scrim = $('#scrim'), mbtn = $('#menuBtn');
  function menu(open) { drawer.classList.toggle('open', open); scrim.classList.toggle('show', open); drawer.setAttribute('aria-hidden', open ? 'false' : 'true'); mbtn.setAttribute('aria-expanded', open ? 'true' : 'false'); if (open) $('#menuClose').focus({ preventScroll: true }); else mbtn.focus({ preventScroll: true }); }
  mbtn.addEventListener('click', function () { menu(true); }); $('#menuClose').addEventListener('click', function () { menu(false); }); scrim.addEventListener('click', function () { menu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') menu(false); });
  $('#logout').addEventListener('click', function () { try { sessionStorage.removeItem('bia_session'); sessionStorage.removeItem('bia_result'); } catch (e) {} location.href = LOGIN_PAGE; });
  document.addEventListener('pointermove', function (e) { var g = e.target.closest && e.target.closest('.glass'); if (!g) return; var r = g.getBoundingClientRect(); g.style.setProperty('--mx', (e.clientX - r.left) + 'px'); g.style.setProperty('--my', (e.clientY - r.top) + 'px'); });

  /* state */
  var all = [], tab = 'practice', prog = 'all', q = '', body = $('#body'), hist = null, PASS = 50;
  function setTab(t) {
    tab = t; $('#tabs').setAttribute('data-tab', t);
    [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { var on = b.dataset.tab === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
    [].forEach.call(document.querySelectorAll('.drawer nav button'), function (b) { b.classList.toggle('on', b.dataset.go === t); });
    render();
  }
  [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });
  [].forEach.call(document.querySelectorAll('.drawer nav button'), function (b) { b.addEventListener('click', function () { setTab(b.dataset.go); menu(false); window.scrollTo({ top: 0, behavior: 'smooth' }); }); });

  var DEMO_LIST = [
    { code: 'p1', title: 'Mathematics: Algebra', subject: 'Mathematics', programme: 'JAMB', mode: 'practice', questions: 40, duration_minutes: 0 },
    { code: 'p2', title: 'Biology: Cell Structure', subject: 'Biology', programme: 'JAMB', mode: 'practice', questions: 30, duration_minutes: 0 },
    { code: 'p3', title: 'Physics: Mechanics', subject: 'Physics', programme: 'JUPEB', mode: 'practice', questions: 50, duration_minutes: 0 },
    { code: 'p4', title: 'English: Lexis and Structure', subject: 'English', programme: 'JAMB', mode: 'practice', questions: 50, duration_minutes: 0 },
    { code: 'p5', title: 'Chemistry: Organic Basics', subject: 'Chemistry', programme: 'JUPEB', mode: 'practice', questions: 45, duration_minutes: 0 },
    { code: 't1', title: 'Physics: Mechanics Test', subject: 'Physics', programme: 'JUPEB', mode: 'test', questions: 40, duration_minutes: 30, status: 'available' },
    { code: 't2', title: 'Economics: Demand and Supply', subject: 'Economics', programme: 'JUPEB', mode: 'test', questions: 40, duration_minutes: 35, status: 'in_progress' },
    { code: 't3', title: 'Further Mathematics: Matrices', subject: 'Further Mathematics', programme: 'JUPEB', mode: 'test', questions: 30, duration_minutes: 45, status: 'completed', last_score: 74 }
  ];

  function load() {
    body.innerHTML = ''; var g = el('div', 'grid'); for (var i = 0; i < 3; i++) g.appendChild(el('div', 'skel')); body.appendChild(g);
    var req = DEMO ? new Promise(function (r) { setTimeout(function () { r({ ok: true, quizzes: DEMO_LIST }); }, 600); })
      : fetch(QUIZZES_API, { headers: { Authorization: 'Bearer ' + (session.token || '') } }).then(function (r) { if (r.status === 401 || r.status === 403) { try { sessionStorage.removeItem('bia_session'); } catch (e) {} location.replace(LOGIN_PAGE); throw new Error('auth'); } return r.json(); });
    req.then(function (res) { if (!res || !res.ok) throw new Error('fail'); all = res.quizzes || []; counts(); renderResume(); render(); loadHistory(); })
      .catch(function (e) { if (e && e.message === 'auth') return; body.innerHTML = ''; body.appendChild(stateBox('i-alert', 'Could not load quizzes', 'Check your connection and try again.', 'Try again', load)); });
  }
  function counts() { $('#nP').textContent = all.filter(function (x) { return x.mode !== 'test'; }).length; $('#nT').textContent = all.filter(function (x) { return x.mode === 'test'; }).length; }
  function stateBox(icon, title, text, btnText, fn) {
    var s = el('div', 'state glass'); var i = el('div', 'si'); i.appendChild(ico(icon)); s.appendChild(i); s.appendChild(el('h3', null, title)); s.appendChild(el('p', null, text));
    if (btnText) { var b = el('button', 'btn btn-red'); b.type = 'button'; b.appendChild(el('span', null, btnText)); b.addEventListener('click', fn); s.appendChild(b); } return s;
  }

  function render() {
    body.innerHTML = '';
    if (tab === 'results') { renderResults(); return; }
    if (tab === 'test' && !canTest) { body.appendChild(stateBox('i-lock', 'Test mode is for paying tutorial students', 'Log in with your BIA ID to take timed tests. You can still use Practice mode.', 'Log in with BIA ID', function () { try { sessionStorage.removeItem('bia_session'); } catch (e) {} location.href = LOGIN_PAGE; })); return; }
    var isTest = tab === 'test';
    var info = el('div', 'info glass'); info.appendChild(ico(isTest ? 'i-shield' : 'i-book'));
    var tx = el('div'); tx.innerHTML = isTest ? '<b>Test mode.</b> One attempt, timed. Leaving the tab is recorded, and copying is blocked.' : '<b>Practice mode.</b> Retake as many times as you like and see the answer and explanation after each question.'; info.appendChild(tx); body.appendChild(info);

    var list = all.filter(function (x) { return (x.mode === 'test') === isTest; });
    var progs = Array.from(new Set(list.map(function (x) { return x.programme; }).filter(Boolean)));
    if (prog !== 'all' && progs.indexOf(prog) < 0) prog = 'all';
    var tools = el('div', 'tools');
    var sw = el('label', 'search'); sw.appendChild(ico('i-search')); var inp = el('input'); inp.type = 'search'; inp.placeholder = 'Search by subject or title'; inp.value = q; inp.setAttribute('aria-label', 'Search quizzes'); inp.autocomplete = 'off'; sw.appendChild(inp); tools.appendChild(sw);
    if (progs.length > 1) { var sg = el('div', 'seg'); ['all'].concat(progs).forEach(function (p) { var b = el('button', prog === p ? 'on' : '', p === 'all' ? 'All' : p); b.type = 'button'; b.addEventListener('click', function () { prog = p; render(); }); sg.appendChild(b); }); tools.appendChild(sg); }
    body.appendChild(tools);
    var host = el('div'); body.appendChild(host);
    function draw() {
      host.innerHTML = '';
      var rows = list.filter(function (x) { return (prog === 'all' || x.programme === prog) && (!q || (x.title + ' ' + x.subject + ' ' + x.programme).toLowerCase().indexOf(q.toLowerCase()) > -1); });
      if (!rows.length) { host.appendChild(list.length ? stateBox('i-search', 'No quizzes match', 'Try a different search or filter.') : stateBox('i-inbox', isTest ? 'No tests are open right now' : 'No practice quizzes yet', 'Please check back later.')); return; }
      var g = el('div', 'grid'); rows.forEach(function (x, i) { var c = card(x, isTest); c.style.animationDelay = Math.min(i, 8) * 50 + 'ms'; g.appendChild(c); }); host.appendChild(g);
    }
    inp.addEventListener('input', function () { q = inp.value.trim(); draw(); });
    draw();
  }

  function card(x, isTest) {
    var c = el('article', 'card glass' + (isTest ? ' test' : ''));
    var h = el('div', 'head'); var qi = el('span', 'qi'); qi.appendChild(ico(isTest ? 'i-shield' : 'i-book')); h.appendChild(qi);
    var m = el('div'); m.appendChild(el('h3', null, x.title)); m.appendChild(el('div', 'sub', [x.programme, x.subject].filter(Boolean).join(' • '))); h.appendChild(m); c.appendChild(h);
    var ch = el('div', 'chips');
    var c1 = el('span', 'chip'); c1.appendChild(ico('i-list')); c1.appendChild(document.createTextNode(x.questions + ' questions')); ch.appendChild(c1);
    if (x.duration_minutes) { var c2 = el('span', 'chip'); c2.appendChild(ico('i-timer')); c2.appendChild(document.createTextNode(x.duration_minutes + ' min')); ch.appendChild(c2); }
    if (isTest) { var c3 = el('span', 'chip'); c3.appendChild(ico('i-shield')); c3.appendChild(document.createTextNode('One attempt')); ch.appendChild(c3); }
    if (x.status === 'completed') { var c4 = el('span', 'chip good'); c4.appendChild(ico('i-check')); c4.appendChild(document.createTextNode(typeof x.last_score === 'number' ? 'Completed ' + x.last_score + '%' : 'Completed')); ch.appendChild(c4); }
    if (x.status === 'in_progress') { var c5 = el('span', 'chip warn'); c5.appendChild(ico('i-timer')); c5.appendChild(document.createTextNode('In progress')); ch.appendChild(c5); }
    c.appendChild(ch);
    var a = el('a', 'btn ' + (x.status === 'completed' ? 'btn-ghost' : 'btn-red'));
    if (x.status === 'completed') { a.setAttribute('aria-disabled', 'true'); a.appendChild(ico('i-check')); a.appendChild(el('span', null, 'Test completed')); }
    else { a.href = QUIZ_PAGE + '?quiz=' + encodeURIComponent(x.code); a.appendChild(el('span', null, x.status === 'in_progress' ? 'Resume test' : (isTest ? 'Start test' : 'Start practice'))); a.appendChild(ico('i-arrow', 'go')); }
    c.appendChild(a); return c;
  }


  /* ---------- progress, resume and results history ---------- */
  var DEMO_ATTEMPTS = [['Mathematics: Algebra', 'Mathematics', 'JAMB', 'practice', 8, 10, 1], ['Physics: Mechanics Test', 'Physics', 'JUPEB', 'test', 31, 40, 2], ['Biology: Cell Structure', 'Biology', 'JAMB', 'practice', 19, 30, 4], ['Physics: Mechanics', 'Physics', 'JUPEB', 'practice', 29, 50, 6], ['English: Lexis and Structure', 'English', 'JAMB', 'practice', 41, 50, 8], ['Chemistry: Organic Basics', 'Chemistry', 'JUPEB', 'practice', 22, 45, 10], ['Mathematics: Algebra', 'Mathematics', 'JAMB', 'practice', 26, 40, 13], ['Biology: Cell Structure', 'Biology', 'JAMB', 'practice', 14, 30, 16]];
  function demoHistory() { return { ok: true, history: true, pass_mark: 50, attempts: DEMO_ATTEMPTS.map(function (a, i) { return { id: 'demo-' + i, quiz: 'demo' + i, title: a[0], subject: a[1], programme: a[2], mode: a[3], score: a[4], total: a[5], percent: Math.round(a[4] / a[5] * 100), seconds_taken: 600 + i * 95, tab_switches: a[3] === 'test' ? 1 : 0, reason: 'submitted', at: Date.now() - a[6] * 86400000 }; }) }; }
  function demoResult(a) {
    var opts = function (x) { return ['A', 'B', 'C', 'D'].map(function (k) { return { key: k, text: x + ' ' + k }; }); }, rows = [];
    for (var i = 1; i <= 6; i++) { var right = i % 3 !== 0; rows.push({ id: 'q' + i, text: 'Sample question ' + i + ' from ' + a.title, options: opts('Option'), chosen: right ? 'B' : 'C', answer: 'B', correct: right, explanation: 'This is a sample explanation for the demo.' }); }
    var sc = rows.filter(function (r) { return r.correct; }).length;
    return { quiz: a.quiz, title: a.title, mode: a.mode, score: sc, total: 6, percent: Math.round(sc / 6 * 100), seconds_taken: a.seconds_taken, tab_switches: a.tab_switches, reason: 'submitted', rows: rows };
  }
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2600); }
  function shortDate(ts) { var d = new Date(ts); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }
  function fullDate(ts) { var d = new Date(ts); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function mmss(s) { s = Math.max(0, Math.round(s || 0)); var m = Math.floor(s / 60), x = s % 60; return m + ':' + (x < 10 ? '0' : '') + x; }
  function band(p) { return p >= 70 ? '' : p >= PASS ? 'mid' : 'low'; }

  function loadHistory() {
    if (!isPaid) { hist = { history: false, attempts: [] }; renderSummary(); return; }
    var req = DEMO ? new Promise(function (r) { setTimeout(function () { r(demoHistory()); }, 400); })
      : fetch(HISTORY_API, { headers: { Authorization: 'Bearer ' + (session.token || '') } }).then(function (r) { return r.json(); });
    req.then(function (r) { if (!r || !r.ok) throw new Error('fail'); hist = r; PASS = r.pass_mark || 50; })
      .catch(function () { hist = { history: true, attempts: [], failed: true }; })
      .then(function () { $('#nR').textContent = hist.attempts.length; renderSummary(); if (tab === 'results') render(); });
  }

  function renderSummary() {
    var box = $('#summary'); box.innerHTML = '';
    if (!hist || !hist.history || !hist.attempts.length) return;
    var at = hist.attempts, ps = at.map(function (a) { return a.percent; }), avg = Math.round(ps.reduce(function (x, y) { return x + y; }, 0) / ps.length), best = Math.max.apply(null, ps), passed = Math.round(ps.filter(function (p) { return p >= PASS; }).length / ps.length * 100);
    var wrap = el('div', 'stats');
    [['i-list', 'Quizzes taken', String(at.length), ''], ['i-target', 'Average score', String(avg), '%'], ['i-trophy', 'Best score', String(best), '%'], ['i-check', 'Pass rate', String(passed), '%']].forEach(function (s, i) {
      var c = el('div', 'stat glass'); c.style.animationDelay = i * 60 + 'ms'; var l = el('div', 'l'); l.appendChild(ico(s[0])); l.appendChild(el('span', null, s[1])); c.appendChild(l);
      var v = el('div', 'v', s[2]); if (s[3]) v.appendChild(el('small', null, s[3])); c.appendChild(v); wrap.appendChild(c);
    });
    box.appendChild(wrap);
  }

  function renderResume() {
    var box = $('#resume'); box.innerHTML = ''; if (!canTest) return;
    all.filter(function (x) { return x.status === 'in_progress'; }).forEach(function (x) {
      var c = el('div', 'resume glass'); var i = el('span', 'ri'); i.appendChild(ico('i-timer')); c.appendChild(i);
      var t = el('div', 'rt'); t.appendChild(el('b', null, x.title)); t.appendChild(el('span', null, 'You started this test. Pick up where you left off.')); c.appendChild(t);
      var a = el('a', 'btn btn-red'); a.href = QUIZ_PAGE + '?quiz=' + encodeURIComponent(x.code); a.appendChild(el('span', null, 'Resume test')); a.appendChild(ico('i-arrow', 'go')); c.appendChild(a); box.appendChild(c);
    });
  }

  function renderResults() {
    body.innerHTML = '';
    if (!isPaid) { body.appendChild(stateBox('i-lock', 'Results history is for paying tutorial students', 'Log in with your BIA ID to keep a record of every quiz you take. You still see your score right after each quiz.', 'Log in with BIA ID', function () { try { sessionStorage.removeItem('bia_session'); } catch (e) {} location.href = LOGIN_PAGE; })); return; }
    if (!hist) { var g = el('div', 'grid'); for (var i = 0; i < 3; i++) g.appendChild(el('div', 'skel')); body.appendChild(g); return; }
    if (hist.failed) { body.appendChild(stateBox('i-alert', 'Could not load your results', 'Check your connection and try again.', 'Try again', function () { hist = null; render(); loadHistory(); })); return; }
    var at = hist.attempts;
    if (!at.length) { body.appendChild(stateBox('i-chart', 'No results yet', 'Finish a quiz and it will show up here, with your score and a way to review every question.', 'Start a quiz', function () { setTab('practice'); })); return; }

    var two = el('div', 'two');
    var recent = at.slice(0, 10).reverse(), p1 = el('div', 'panel glass');
    p1.appendChild(el('h3', null, 'Your last ' + recent.length + ' scores')); p1.appendChild(el('div', 'sub2', 'Green is 70% or more. Amber is a pass. Red is below the pass mark (' + PASS + '%).'));
    var bars = el('div', 'bars');
    recent.forEach(function (a, i) { var col = el('div', 'bcol'); col.title = a.title + ': ' + a.percent + '%'; col.appendChild(el('span', 'pc', a.percent + '%')); var b = el('div', 'b ' + (a.percent >= 70 ? 'ok' : a.percent >= PASS ? 'mid' : '')); b.style.setProperty('--h', Math.round(a.percent / 100 * 140) + 'px'); b.style.animationDelay = i * 50 + 'ms'; col.appendChild(b); col.appendChild(el('span', 'dt', shortDate(a.at))); bars.appendChild(col); });
    p1.appendChild(bars); two.appendChild(p1);

    var by = {}; at.forEach(function (a) { var k = a.subject || 'Other'; (by[k] = by[k] || []).push(a.percent); });
    var subs = Object.keys(by).map(function (k) { return { n: k, avg: Math.round(by[k].reduce(function (x, y) { return x + y; }, 0) / by[k].length), c: by[k].length }; }).sort(function (a, b) { return a.avg - b.avg; });
    var p2 = el('div', 'panel glass'); p2.appendChild(el('h3', null, 'Your subjects')); p2.appendChild(el('div', 'sub2', subs.length > 1 ? 'Weakest first, so you know what to practise.' : 'Your average in this subject.'));
    var sl = el('div', 'subj'); subs.slice(0, 6).forEach(function (s) { var r = el('div'); var tp = el('div', 'top'); tp.appendChild(el('span', null, s.n + ' (' + s.c + ')')); tp.appendChild(el('b', null, s.avg + '%')); r.appendChild(tp); var m = el('div', 'meter'); var f = el('span'); f.dataset.w = s.avg; m.appendChild(f); r.appendChild(m); sl.appendChild(r); });
    p2.appendChild(sl); two.appendChild(p2); body.appendChild(two);
    setTimeout(function () { [].forEach.call(document.querySelectorAll('.meter span[data-w]'), function (f) { f.style.width = f.dataset.w + '%'; }); }, 60);

    var list = el('div', 'alist');
    at.forEach(function (a, i) {
      var r = el('button', 'arow glass'); r.type = 'button'; r.style.animationDelay = Math.min(i, 8) * 40 + 'ms'; r.setAttribute('aria-label', 'Review ' + a.title);
      var qi = el('span', 'qi'); qi.appendChild(ico(a.mode === 'test' ? 'i-shield' : 'i-book')); r.appendChild(qi);
      var m = el('span', 'am'); m.appendChild(el('b', null, a.title)); m.appendChild(el('span', null, [a.mode === 'test' ? 'Test' : 'Practice', a.programme, fullDate(a.at), mmss(a.seconds_taken) + ' min'].filter(Boolean).join(' • '))); r.appendChild(m);
      r.appendChild(el('span', 'score ' + band(a.percent), a.score + '/' + a.total + ' • ' + a.percent + '%')); r.appendChild(ico('i-chevron', 'chev'));
      r.addEventListener('click', function () { viewResult(a, r); }); list.appendChild(r);
    });
    body.appendChild(list);
  }

  function viewResult(a, row) {
    row.classList.add('loading');
    var req = DEMO ? Promise.resolve({ ok: true, result: demoResult(a) })
      : fetch(RESULT_API, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (session.token || '') }, body: JSON.stringify({ id: a.id }) }).then(function (r) { return r.json(); });
    req.then(function (res) { if (!res || !res.ok) throw new Error(res && res.error || 'fail'); try { sessionStorage.setItem('bia_result', JSON.stringify(res.result)); } catch (e) {} location.href = RESULTS_PAGE + '?quiz=' + encodeURIComponent(a.quiz); })
      .catch(function (e) { row.classList.remove('loading'); toast(e && e.message && e.message !== 'fail' && e.message !== 'Failed to fetch' ? e.message : 'Could not open this result. Try again.'); });
  }

  load();
})();
</script>
</body>
